services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8081:8081"
    networks: [lab-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).close()"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s

  client:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    networks: [lab-net]
    restart: "no"

networks:
  lab-net:
    driver: bridge
