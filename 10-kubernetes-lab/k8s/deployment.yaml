apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-api
  labels:
    app: cloud-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloud-api
  template:
    metadata:
      labels:
        app: cloud-api
    spec:
      containers:
        - name: api
          image: cloud-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: APP_VERSION
              value: v1
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
